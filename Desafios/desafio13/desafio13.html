<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequeno desafio</title>
    <style>
        table{
            border-collapse: collapse;
            width: 300px;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th, td{
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
        th.Media{
            text-align: left;
            background-color: gray;
            color: white;
        }
        thead{
            background-color: gray;
            color: white;
        }
        td.media{
            background-color: gray;
            color: white;
        }
        th.ar{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
        }

    </style>
</head>
<body>
    <h1>Exercio de tabela</h1>
    <table>
        <caption>
            Filmes favoritos
        </caption>
        <thead>
            <tr>
                <th rowspan="2">Area</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Media</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="ar">Exatas</th>
                <th rowspan="1">Matematica</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
            </tr>
            <tr>
                <th rowspan="1">Quimica</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
            </tr>
            <tr>
                <th rowspan="1">Fisica</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
            </tr>
            <tr>
                <th rowspan="1">Biologia</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
            </tr>
            <tr>
                <th colspan="4" class="Media">Media de exatas</th>
                <td class="media">0.0</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup" class="ar">Humanas</th>
                <th>Historia</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
                
            </tr>
            <tr>
                <th>Geografia</th>
                <td>000</td>
                <td>000</td>
                <td>000</td>
            </tr>
            <tfoot>
                <tr>
                    <th colspan="4" class="Media">Media de Humanas</th>
                    <td class="media">0.0</td>
                </tr>
            </tfoot>
            
        </tbody>
    </table>
</body>
</html>
