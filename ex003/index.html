<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mides em HTML5</title>
</head>
<body>
    <h1>Imagem Dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou aumente o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>
    <p>E assim temos imagens que se dispercam a depender do tamanho do despositivo que abre o seu site</p>
    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5.</p>
    <audio src="midie/guanacast-33.mp3" controls autoplay></audio> <!--MP3 WAV OGG-->
    <audio preload="">
        <source src="midie/guanacast-33.mp3" type="audio/mpeg">
        <source src="midie/guanacast-33.ogg" type="audio/ogg">
        <source src="midie/guanacast-33.wav" type="audio/wav">
        <p>infelizmente seu navegador nao consegue reproduzir audio. <a href="midie/guanacast-33.mp3">clique aqui para baixar o arquivo MP3</a></p>
    </audio>
    
</body>
</html>
