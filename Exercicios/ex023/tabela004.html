<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th{
            border:2px solid black;
            padding: 10px;
        }
       tr:nth-child(2n){
        background-color: gray;
       }
       div#container{
        overflow-x: auto;
       }
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
    <div id="container">
        <table>
            <colgroup>
                <col class="nome" span="2">
                <col class="sexo">
                <col class="idade">
                <col class="profissão">
            </colgroup>
            <caption>Cadastro</caption>
            <tr>
                <th scope="colgroup">Nome</th>
                <th>sexo</th>
                <th>idade</th>
                <th>profissão</th>
            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Atendente</td>
            </tr>
            <tr>
                <td>Luiz</td>
                <td>M</td>
                <td>23</td>
                <td>Jogador</td>
            </tr>
            <tr>
                <td>Leonardo</td>
                <td>M</td>
                <td>22</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Thaylla</td>
                <td>F</td>
                <td>22</td>
                <td>Nail dsigner</td>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>M</td>
                <td>24</td>
                <td>Policial Militar</td>
            </tr>
        </table>
    </div>
</body>
</html>
